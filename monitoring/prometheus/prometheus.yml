global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus tự giám sát
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Ứng dụng PetManagement (prometheus-net, endpoint /metrics)
  - job_name: 'petmanagement-web'
    metrics_path: /metrics
    static_configs:
      - targets: ['petmanagement_webapp:80']

  # Metrics hệ điều hành (CPU, RAM, Disk, Network)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['petmanagement_node_exporter:9100']

  # Metrics từng Docker container
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['petmanagement_cadvisor:8080']
