# SonarQube Project Configuration
sonar.projectKey=PetManagement
sonar.projectName=Pet Management System
sonar.projectVersion=1.0

# Source and language
sonar.sources=.
sonar.language=cs
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/wwwroot/**,**/*.css,**/*.js,**/*.html,**/Migrations/**

# Test reports
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.dotcover.reportsPaths=**/coverage.dcvr

# Quality gate
sonar.qualitygate.wait=true
